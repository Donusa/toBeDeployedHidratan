<h2 mat-dialog-title>Detalles del Repartidor</h2>

<mat-dialog-content>
  <div class="details-container">
    <div class="detail-section">
      <div class="detail-header">
        <mat-icon>person</mat-icon>
        <h3>Información del Repartidor</h3>
      </div>
      <div class="detail-content">
        <div class="detail-item">
          <span class="label">Nombre:</span>
          <span class="value">{{data.name}}</span>
        </div>
        <div class="detail-item">
          <span class="label">Email:</span>
          <span class="value">{{data.email}}</span>
        </div>
        <div class="detail-item">
          <span class="label">Estado:</span>
          <span [class]="'status-badge ' + (data.active ? 'active' : 'inactive')">
            {{data.active ? 'Activo' : 'Inactivo'}}
          </span>
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-header">
        <mat-icon>inventory</mat-icon>
        <h3>Stock Asignado</h3>
      </div>
      <div class="detail-content">
        <table mat-table [dataSource]="data.products" class="stock-table">
          <ng-container matColumnDef="product">
            <th mat-header-cell *matHeaderCellDef>Producto</th>
            <td mat-cell *matCellDef="let item">{{item.product.name}}</td>
          </ng-container>

          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef>Cantidad</th>
            <td mat-cell *matCellDef="let item">{{item.quantity}}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <div *ngIf="!data.products || data.products.length === 0" class="no-stock-message">
          <mat-icon>inventory_2</mat-icon>
          <p>Este repartidor no tiene stock asignado</p>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="downloadDeliveries()">
    <mat-icon>download</mat-icon>
    Descargar Entregas
  </button>
  <button mat-button (click)="onClose()">Cerrar</button>
</mat-dialog-actions>
