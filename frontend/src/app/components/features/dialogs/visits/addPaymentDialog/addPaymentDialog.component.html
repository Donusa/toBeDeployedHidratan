<h2 mat-dialog-title>Registrar Pago</h2>

<form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-fields">
      <div class="current-debt">
        <span>Deuda actual:</span>
        <span class="debt-amount">{{data.currentDebt | currency:'ARS':'symbol-narrow'}}</span>
      </div>

      <mat-form-field appearance="outline">
        <mat-label>Monto a pagar</mat-label>
        <input matInput type="number" formControlName="amount" 
               min="1" step="0.01">
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('required')">
          El monto es requerido
        </mat-error>
        <mat-error *ngIf="paymentForm.get('amount')?.hasError('min')">
          El monto debe ser mayor a 0
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onClose()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!paymentForm.valid">
      Registrar
    </button>
  </mat-dialog-actions>
</form>
