<h2 mat-dialog-title>Nuevo Cliente</h2>

<form [formGroup]="clientForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-fields">
      <mat-form-field appearance="outline">
        <mat-label>Dirección</mat-label>
        <input matInput formControlName="address" placeholder="Ingrese la dirección">
        <mat-error *ngIf="clientForm.get('address')?.hasError('required')">
          La dirección es requerida
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phoneNumber" placeholder="Ingrese el número de teléfono">
        <mat-error *ngIf="clientForm.get('phoneNumber')?.hasError('required')">
          El teléfono es requerido
        </mat-error>
        <mat-error *ngIf="clientForm.get('phoneNumber')?.hasError('pattern')">
          Debe ser un número de 10 dígitos
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Frecuencia de visita (días)</mat-label>
        <input matInput type="number" formControlName="frecuency" placeholder="Ingrese la frecuencia">
        <mat-error *ngIf="clientForm.get('frecuency')?.hasError('required')">
          La frecuencia es requerida
        </mat-error>
        <mat-error *ngIf="clientForm.get('frecuency')?.hasError('min')">
          Debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Deuda inicial</mat-label>
        <input matInput type="number" formControlName="debt" placeholder="Ingrese la deuda inicial">
        <mat-error *ngIf="clientForm.get('debt')?.hasError('required')">
          La deuda es requerida
        </mat-error>
        <mat-error *ngIf="clientForm.get('debt')?.hasError('min')">
          No puede ser negativa
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!clientForm.valid">Guardar</button>
  </mat-dialog-actions>
</form>
