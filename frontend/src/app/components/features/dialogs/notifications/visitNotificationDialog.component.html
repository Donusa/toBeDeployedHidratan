<h2 mat-dialog-title>Visitas Asignadas</h2>
<mat-dialog-content>
    <p>El repartidor tiene las siguientes visitas asignadas:</p>
    <ul>
        <li *ngFor="let visit of data.visits">{{ visit.details }}</li>
    </ul>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button (click)="onClose()">Cerrar</button>
</mat-dialog-actions>
