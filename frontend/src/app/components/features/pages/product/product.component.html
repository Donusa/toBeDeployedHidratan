<div class="worker-management-container">
  <div class="web-view">
    <div class="header">
      <div class="header-left">
        <button mat-icon-button (click)="goBack()">
          <mat-icon>arrow_back</mat-icon>
        </button>
        <h2>Gestión de Productos</h2>
      </div>
      <div class="actions">
        <button mat-raised-button color="primary" *ngIf="isAdmin" (click)="openNewProductDialog()">
          <mat-icon class="add-icon">add</mat-icon>
          Nuevo Producto
        </button>
      </div>
    </div>

    <div class="stats-container">
      <div class="stat-card">
        <mat-icon>inventory_2</mat-icon>
        <div class="stat-content">
          <div class="stat-text">
            <span class="stat-value">{{getTotalProducts()}}</span>
            <span class="stat-unit">productos</span>
          </div>
          <span class="stat-label">Total de Productos</span>
        </div>
      </div>
    </div>

    <mat-card class="products-table-card">
      <div *ngIf="isLoading" class="loading-spinner-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div [class.hidden]="isLoading">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Buscar producto</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Bidón 20L" #input>
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <table mat-table [dataSource]="dataSource" matSort class="products-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
            <td mat-cell *matCellDef="let product"> {{product.name}} </td>
          </ng-container>

          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Precio </th>
            <td mat-cell *matCellDef="let product"> {{product.price | currency:'ARS':'symbol-narrow'}} </td>
          </ng-container>

          <ng-container matColumnDef="returnable">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Retornable </th>
            <td mat-cell *matCellDef="let product">
              <mat-icon [class.returnable]="product.returnable">
                {{product.returnable ? 'check_circle' : 'cancel'}}
              </mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" 
              (click)="row && openProductDetails(row)"
              class="product-row">
          </tr>

          <tr class="mat-mdc-row" *matNoDataRow>
            <td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">
              No hay productos registrados
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página de productos"></mat-paginator>
    </mat-card>
  </div>
  
  <button mat-fab color="primary" 
          class="mobile-fab-button" 
          *ngIf="isAdmin" 
          (click)="openNewProductDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
