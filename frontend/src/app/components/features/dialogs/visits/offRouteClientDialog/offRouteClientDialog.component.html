<h2 mat-dialog-title>Seleccionar Cliente</h2>

<mat-dialog-content>
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar cliente</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Dirección o teléfono">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div *ngIf="isLoading" class="loading-spinner-container">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div [class.hidden]="isLoading">
    <table mat-table [dataSource]="dataSource" class="clients-table">
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef> Dirección </th>
        <td mat-cell *matCellDef="let client"> {{client.address}} </td>
      </ng-container>

      <ng-container matColumnDef="phoneNumber">
        <th mat-header-cell *matHeaderCellDef> Teléfono </th>
        <td mat-cell *matCellDef="let client"> {{client.phoneNumber}} </td>
      </ng-container>

      <ng-container matColumnDef="debt">
        <th mat-header-cell *matHeaderCellDef> Deuda </th>
        <td mat-cell *matCellDef="let client"> {{client.debt | currency:'ARS':'symbol-narrow'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selectClient(row)" class="client-row"></tr>

      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell" [attr.colspan]="displayedColumns.length">
          No hay clientes disponibles
        </td>
      </tr>
    </table>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button color="primary" (click)="openNewClient()">Nuevo cliente</button>
  <button mat-button (click)="onCancel()">Cancelar</button>
</mat-dialog-actions>
