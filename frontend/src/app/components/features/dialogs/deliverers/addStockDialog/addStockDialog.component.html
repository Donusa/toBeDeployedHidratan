<h2 mat-dialog-title>Agregar Stock</h2>
<form [formGroup]="stockForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-fields">
      <mat-form-field appearance="outline">
        <mat-label>Producto</mat-label>
        <mat-select formControlName="productId">
          <mat-option *ngFor="let product of products" [value]="product.id">
            {{product.name}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="stockForm.get('productId')?.hasError('required')">
          Seleccione un producto
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cantidad</mat-label>
        <input matInput 
               type="number" 
               formControlName="quantity" 
               placeholder="Cantidad"
               min="1">
        <mat-error *ngIf="stockForm.get('quantity')?.hasError('required')">
          La cantidad es requerida
        </mat-error>
        <mat-error *ngIf="stockForm.get('quantity')?.hasError('min')">
          La cantidad debe ser mayor a 0
        </mat-error>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!stockForm.valid">
      Agregar
    </button>
  </mat-dialog-actions>
</form>
