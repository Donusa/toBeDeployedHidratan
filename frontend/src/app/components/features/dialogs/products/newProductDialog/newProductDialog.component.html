<h2 mat-dialog-title>Nuevo Producto</h2>

<form [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content>
    <div class="form-container">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="name" placeholder="Nombre del producto">
        <mat-error *ngIf="productForm.get('name')?.hasError('required')">
          El nombre es requerido
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="price" placeholder="0.00">
        <mat-error *ngIf="productForm.get('price')?.hasError('required')">
          El precio es requerido
        </mat-error>
        <mat-error *ngIf="productForm.get('price')?.hasError('min')">
          El precio debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Retornable</mat-label>
        <mat-select formControlName="returnable">
          <mat-option [value]="true">Sí</mat-option>
          <mat-option [value]="false">No</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="!productForm.valid">
      Crear Producto
    </button>
  </mat-dialog-actions>
</form>
